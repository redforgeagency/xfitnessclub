<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="redGradReal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#C0000C" />
    </linearGradient>
    <filter id="brushGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#C0000C" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Aggressive brush-stroke red X -->
  <g filter="url(#brushGlow)">
    <!-- Top-left to bottom-right main brush stroke -->
    <path d="M22 10 C32 18, 54 48, 85 82 C78 84, 70 80, 58 66 C42 46, 26 24, 16 14 C18 10, 20 10, 22 10 Z" fill="url(#redGradReal)" />
    <!-- Top-right to bottom-left cross stroke -->
    <path d="M78 12 C68 24, 38 62, 14 78 C12 76, 15 70, 24 60 C40 42, 66 18, 74 12 C76 12, 78 12, 78 12 Z" fill="url(#redGradReal)" />
    <!-- Dynamic horizontal brush splash through the middle -->
    <path d="M5 48 Q45 42 135 40 Q105 47 40 52 Q18 53 5 48 Z" fill="url(#redGradReal)" opacity="0.95" />
    <path d="M28 26 L65 65 L55 70 L20 30 Z" fill="#FFFFFF" opacity="0.2" />
  </g>

  <!-- Typography -->
  <!-- FITNESS (Dark Bold) -->
  <text x="96" y="44" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#111317">
    FITNESS
  </text>
  
  <!-- CLUB (Red Bold) -->
  <text x="145" y="76" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="3" fill="url(#redGradReal)">
    CLUB
  </text>
</svg>
